[project]
name = "gh-commit-history"
version = "0.1.0"
description = "Export every commit you authored on GitHub to a YAML file."
readme = "README.md"
authors = [
    { name = "Ohad Rubin", email = "iohadrubin@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
gh-commit-history = "gh_commit_history.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
